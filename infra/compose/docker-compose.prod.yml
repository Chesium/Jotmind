version: "3.9"
services:
  api:
    image: myrepo/api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD} # 从宿主/CI注入
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      DEV_API_PORT: ${DEV_API_PORT}
    expose:
      - "3000"
    depends_on:
      neo4j:
        condition: service_started
    networks: [appnet]

  web:
    image: myrepo/web:latest
    restart: unless-stopped
    expose:
      - "80"
    networks: [appnet]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ../docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [appnet]

  neo4j:
    image: graphstack/dozerdb:5.26.3
    container_name: neo4j
    # hostname: a252c9c242a7
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "*"
      NEO4J_server_config_strict__validation_enabled: "false"
    ports:
      - "7473:7473"
      - "7474:7474"
      - "7687:7687"
    volumes:
      - "${DOZER_BASE}/data:/data"
      - "${DOZER_BASE}/logs:/logs"
      - "${DOZER_BASE}/conf:/var/lib/neo4j/conf"
      - "${DOZER_BASE}/import:/var/lib/neo4j/import"
      - "${DOZER_BASE}/plugins:/plugins"
    networks: [appnet]

networks:
  appnet:
    driver: bridge