# Reference Docker Compose for JotMind's canonical PostgreSQL store.
#
# Starts PostgreSQL 18 with Apache AGE + pgvector. The named volume `jotmind-db`
# is the canonical, durable store: back it up to preserve data. Browser storage
# is NON-canonical and must never be treated as the source of truth.
services:
  db:
    build:
      context: ./infra/db
    image: jotmind-postgres:latest
    # Bind to localhost by default; expose on the LAN only via explicit opt-in.
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-jotmind}
    volumes:
      # PostgreSQL 18 images store data in a version-specific subdirectory, so the
      # volume is mounted at /var/lib/postgresql (not .../data). See
      # https://github.com/docker-library/postgres/pull/1259
      - jotmind-db:/var/lib/postgresql
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jotmind}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jotmind-db:
    # Canonical, durable storage. Back this volume up to preserve your data.
    name: jotmind-db
